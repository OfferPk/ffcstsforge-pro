<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="2" />

  <text x="40" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">FFCSTSForge Pro Architecture</text>
  <text x="40" y="70" font-family="sans-serif" font-size="12" fill="#38bdf8">CCSDS 922.3-B-1 Cross Support Transfer Service Forward Frame (FF-CSTS) Pipeline</text>

  <!-- Layer 1 -->
  <g transform="translate(40, 110)">
    <rect width="240" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">1. MISSION OPERATIONS (USER)</text>
    
    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Raw Forward Frames</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">TC (232.0), AOS, USLP</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Transmission Scheduling</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">Immediate or Earth Transmit Time</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Virtual Channel Multiplexing</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">VC-0 (Commands), VC-1 (Files)</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Service Association (BIND)</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Authentication &amp; Credentials</text>
  </g>

  <path d="M 280 280 L 330 280" stroke="#38bdf8" stroke-width="2" />

  <!-- Layer 2 -->
  <g transform="translate(330, 110)">
    <rect width="240" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">2. FF-CSTS ENGINE</text>
    
    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CSTS State Machine</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">UNBOUND &rarr; READY &rarr; ACTIVE</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Uplink Queue Buffer</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">Capacity Management &amp; FIFO</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Carrier Modulator Control</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">OFF, UNMODULATED, MODULATING</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Asynchronous Notifications</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Buffer Empty &amp; Radiation Events</text>
  </g>

  <path d="M 570 280 L 620 280" stroke="#34d399" stroke-width="2" />

  <!-- Layer 3 -->
  <g transform="translate(620, 110)">
    <rect width="240" height="340" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">3. GROUND STATION (PROVIDER)</text>

    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Channel Coding &amp; ASM</text>
    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">BCH, LDPC, Attached Sync Marker</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">RF Transmitter &amp; Antenna</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">S/X/Ka-band Radiative Uplink</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Glass Cockpit Studio</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">Real-time Telecommand Dashboard</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">10-Point Normative Auditor</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">100% Certified Verification</text>
  </g>
</svg>
