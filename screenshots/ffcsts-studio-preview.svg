  <!-- Live XML Feed Terminal -->
  <g transform="translate(324, 404)">
    <rect x="0" y="0" width="652" height="170" rx="10" fill="#0b0f19" stroke="#334155" />
    <text x="20" y="26" font-family="monospace" font-size="11" fill="#38bdf8">&lt;csts_ff_message xmlns="urn:ccsds:schema:csts:ff:1.0"&gt;</text>
    <text x="36" y="46" font-family="monospace" font-size="11" fill="#94a3b8">&lt;standard&gt;CCSDS 922.3-B-1&lt;/standard&gt;&lt;service_state&gt;ACTIVE&lt;/service_state&gt;</text>
    <text x="36" y="66" font-family="monospace" font-size="11" fill="#34d399">&lt;forward_frame_buffer seq="105"&gt;&lt;radiation_status&gt;RADIATED&lt;/radiation_status&gt;&lt;/forward_frame_buffer&gt;</text>
    <text x="36" y="86" font-family="monospace" font-size="11" fill="#ffffff">&lt;frames_radiated_total&gt;105&lt;/frames_radiated_total&gt;</text>
    <text x="20" y="106" font-family="monospace" font-size="11" fill="#38bdf8">&lt;/csts_ff_message&gt;</text>
