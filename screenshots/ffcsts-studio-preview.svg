    <text x="220" y="94" font-family="sans-serif" font-size="11" fill="#ffffff">CCSDS 232.0 (TC)</text>
    <text x="360" y="94" font-family="sans-serif" font-size="11" fill="#ffffff">VC-01</text>
    <text x="440" y="94" font-family="sans-serif" font-size="11" fill="#ffffff">256 B</text>
    <text x="540" y="94" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">RADIATED</text>

    <text x="25" y="124" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">#104</text>
    <text x="90" y="124" font-family="sans-serif" font-size="11" fill="#38bdf8">TC-FRAME-104</text>
    <text x="220" y="124" font-family="sans-serif" font-size="11" fill="#ffffff">CCSDS 232.0 (TC)</text>
    <text x="360" y="124" font-family="sans-serif" font-size="11" fill="#ffffff">VC-01</text>
    <text x="440" y="124" font-family="sans-serif" font-size="11" fill="#ffffff">256 B</text>
    <text x="540" y="124" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">RADIATED</text>

    <text x="25" y="154" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">#103</text>
    <text x="90" y="154" font-family="sans-serif" font-size="11" fill="#38bdf8">TC-FRAME-103</text>
    <text x="220" y="154" font-family="sans-serif" font-size="11" fill="#ffffff">CCSDS 232.0 (TC)</text>
    <text x="360" y="154" font-family="sans-serif" font-size="11" fill="#ffffff">VC-02</text>
    <text x="440" y="154" font-family="sans-serif" font-size="11" fill="#ffffff">512 B</text>
    <text x="540" y="154" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">RADIATED</text>
